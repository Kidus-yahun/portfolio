<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="emBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a14"/>
      <stop offset="50%" stop-color="#07070d"/>
      <stop offset="100%" stop-color="#140a18"/>
    </linearGradient>
    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <radialGradient id="purpleGlow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="500" fill="url(#emBg)"/>
  <circle cx="400" cy="200" r="260" fill="url(#purpleGlow)"/>

  <!-- Dashboard Window -->
  <rect x="70" y="55" width="660" height="390" rx="16" fill="#0d0d16" stroke="#8b5cf6" stroke-opacity="0.3" stroke-width="1.5"/>
  <rect x="70" y="55" width="660" height="42" rx="16" fill="#141422"/>
  <rect x="70" y="85" width="660" height="12" fill="#141422"/>

  <!-- Window Dots -->
  <circle cx="98" cy="76" r="5" fill="#ff5f56"/>
  <circle cx="116" cy="76" r="5" fill="#ffbd2e"/>
  <circle cx="134" cy="76" r="5" fill="#27c93f"/>

  <!-- Search/Title Bar -->
  <rect x="160" y="65" width="340" height="22" rx="6" fill="#090910" stroke="#ffffff" stroke-opacity="0.1"/>
  <text x="175" y="80" fill="#c4b5fd" font-family="monospace" font-size="11">ethio-matrix://national-exam/grade-12/assessment-v2</text>

  <!-- Tag Pill -->
  <rect x="575" y="66" width="135" height="20" rx="10" fill="#8b5cf6" fill-opacity="0.15" stroke="#a855f7" stroke-opacity="0.4"/>
  <text x="590" y="80" fill="#c4b5fd" font-family="monospace" font-size="10" font-weight="bold">EDTECH PLATFORM</text>

  <!-- Main Content Stage -->
  <g transform="translate(100, 120)">
    <text x="0" y="24" fill="#ffffff" font-family="sans-serif" font-size="22" font-weight="900">Ethio-Matrix Assessment Engine</text>
    <text x="0" y="44" fill="#a78bfa" font-family="monospace" font-size="12" font-weight="bold">NATIONWIDE GRADE 12 TEST GENERATION &amp; PERFORMANCE ANALYTICS</text>

    <!-- Stat Cards Row -->
    <g transform="translate(0, 65)">
      <!-- Card 1 -->
      <rect x="0" y="0" width="180" height="80" rx="10" fill="#151524" stroke="#ffffff" stroke-opacity="0.08"/>
      <text x="16" y="26" fill="#9ca3af" font-family="monospace" font-size="10">CURATED QUESTION BANK</text>
      <text x="16" y="55" fill="#ffffff" font-family="sans-serif" font-size="24" font-weight="bold">14,200+</text>
      <text x="16" y="70" fill="#34d399" font-family="monospace" font-size="9">Verified items across 7 subjects</text>

      <!-- Card 2 -->
      <rect x="205" y="0" width="180" height="80" rx="10" fill="#151524" stroke="#ffffff" stroke-opacity="0.08"/>
      <text x="221" y="26" fill="#9ca3af" font-family="monospace" font-size="10">STUDENT SIMULATIONS</text>
      <text x="221" y="55" fill="#a855f7" font-family="sans-serif" font-size="24" font-weight="bold">98.6%</text>
      <text x="221" y="70" fill="#9ca3af" font-family="monospace" font-size="9">Test completion fidelity</text>

      <!-- Card 3 -->
      <rect x="410" y="0" width="190" height="80" rx="10" fill="#151524" stroke="#ffffff" stroke-opacity="0.08"/>
      <text x="426" y="26" fill="#9ca3af" font-family="monospace" font-size="10">BACKEND ARCHITECTURE</text>
      <text x="426" y="55" fill="#38bdf8" font-family="sans-serif" font-size="20" font-weight="bold">Django &amp; MySQL</text>
      <text x="426" y="70" fill="#9ca3af" font-family="monospace" font-size="9">High-throughput REST API</text>
    </g>

    <!-- Simulated Chart Visual -->
    <g transform="translate(0, 165)">
      <rect x="0" y="0" width="600" height="80" rx="10" fill="#12121e" stroke="#8b5cf6" stroke-opacity="0.2"/>
      <text x="18" y="24" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold">Subject Diagnostic Curves</text>
      <text x="18" y="40" fill="#9ca3af" font-family="monospace" font-size="10">Mathematics · Physics · English · Biology · Chemistry</text>

      <!-- Bar graphics -->
      <rect x="18" y="54" width="90" height="10" rx="3" fill="#a855f7"/>
      <rect x="118" y="54" width="120" height="10" rx="3" fill="#6366f1"/>
      <rect x="248" y="54" width="105" height="10" rx="3" fill="#38bdf8"/>
      <rect x="363" y="54" width="115" height="10" rx="3" fill="#34d399"/>
      <rect x="488" y="54" width="95" height="10" rx="3" fill="#f59e0b"/>
    </g>
  </g>

  <!-- Footer Tag -->
  <g transform="translate(100, 395)">
    <text x="0" y="16" fill="#6b7280" font-family="monospace" font-size="11">FULL-STACK CORE: Python · Django · MySQL · REST APIs · Tailwind</text>
  </g>
</svg>
