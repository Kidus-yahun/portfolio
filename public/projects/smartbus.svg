<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="sbBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1210"/>
      <stop offset="50%" stop-color="#060b09"/>
      <stop offset="100%" stop-color="#0a1814"/>
    </linearGradient>
    <radialGradient id="emeraldGlow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="qrGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#sbBg)"/>
  <circle cx="400" cy="200" r="260" fill="url(#emeraldGlow)"/>

  <!-- Window Mockup -->
  <rect x="60" y="45" width="680" height="410" rx="16" fill="#0c1412" stroke="#10b981" stroke-opacity="0.3" stroke-width="1.5"/>
  <rect x="60" y="45" width="680" height="42" rx="16" fill="#111c19"/>
  <rect x="60" y="75" width="680" height="12" fill="#111c19"/>

  <!-- Window Dots -->
  <circle cx="88" cy="66" r="5" fill="#ff5f56"/>
  <circle cx="106" cy="66" r="5" fill="#ffbd2e"/>
  <circle cx="124" cy="66" r="5" fill="#27c93f"/>

  <!-- URL Bar -->
  <rect x="150" y="55" width="350" height="22" rx="6" fill="#080e0c" stroke="#ffffff" stroke-opacity="0.1"/>
  <text x="165" y="70" fill="#a7f3d0" font-family="monospace" font-size="11">smartbus://addis-ababa/book-ticket/bole-to-stadium</text>

  <!-- Language Switcher Pill -->
  <rect x="525" y="56" width="95" height="20" rx="10" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15"/>
  <text x="537" y="70" fill="#e5e7eb" font-family="sans-serif" font-size="10">🌐 አማርኛ | EN</text>

  <!-- Tag Pill -->
  <rect x="630" y="56" width="95" height="20" rx="10" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-opacity="0.5"/>
  <text x="643" y="70" fill="#6ee7b7" font-family="monospace" font-size="10" font-weight="bold">BUS BOOKING</text>

  <!-- Header Info -->
  <g transform="translate(90, 110)">
    <text x="0" y="24" fill="#ffffff" font-family="sans-serif" font-size="22" font-weight="900">SmartBus Ethiopia (ስማርት ባስ)</text>
    <text x="0" y="44" fill="#34d399" font-family="monospace" font-size="12" font-weight="bold">FULL-STACK BUS BOOKING &amp; DIGITAL QR TICKETING PLATFORM</text>

    <!-- Two-Panel Interface (Booking Form on Left, Digital QR Ticket on Right) -->
    <g transform="translate(0, 65)">
      <!-- Left Panel: Seat Booking Interface -->
      <rect x="0" y="0" width="380" height="195" rx="12" fill="#0e1a17" stroke="#10b981" stroke-opacity="0.25"/>
      
      <!-- Route selector -->
      <g transform="translate(16, 16)">
        <text x="0" y="14" fill="#9ca3af" font-family="monospace" font-size="10">SELECTED ROUTE (የተመረጠ መስመር)</text>
        <rect x="0" y="22" width="348" height="34" rx="8" fill="#132420" stroke="#10b981" stroke-opacity="0.3"/>
        <circle cx="16" cy="39" r="4" fill="#10b981"/>
        <text x="28" y="43" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">Bole (ቦሌ) ➔ Megenagna (መገናኛ) ➔ Stadium</text>

        <!-- Seat grid simulation -->
        <text x="0" y="76" fill="#9ca3af" font-family="monospace" font-size="10">SEAT SELECTION (ወንበር ይምረጡ)</text>
        <g transform="translate(0, 84)">
          <rect x="0" y="0" width="48" height="26" rx="5" fill="#10b981"/>
          <text x="14" y="17" fill="#000000" font-family="monospace" font-size="10" font-weight="bold">01 ✓</text>

          <rect x="56" y="0" width="48" height="26" rx="5" fill="#10b981"/>
          <text x="70" y="17" fill="#000000" font-family="monospace" font-size="10" font-weight="bold">02 ✓</text>

          <rect x="112" y="0" width="48" height="26" rx="5" fill="#1f3832" stroke="#ffffff" stroke-opacity="0.1"/>
          <text x="128" y="17" fill="#9ca3af" font-family="monospace" font-size="10">03</text>

          <rect x="168" y="0" width="48" height="26" rx="5" fill="#ff5c3d" fill-opacity="0.2" stroke="#ff5c3d" stroke-opacity="0.5"/>
          <text x="176" y="17" fill="#fca5a5" font-family="monospace" font-size="10">BUSY</text>

          <rect x="224" y="0" width="48" height="26" rx="5" fill="#1f3832" stroke="#ffffff" stroke-opacity="0.1"/>
          <text x="240" y="17" fill="#9ca3af" font-family="monospace" font-size="10">05</text>

          <rect x="280" y="0" width="68" height="26" rx="5" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-opacity="0.4"/>
          <text x="288" y="17" fill="#67e8f9" font-family="monospace" font-size="9">STANDING</text>
        </g>

        <!-- Fare summary -->
        <g transform="translate(0, 122)">
          <text x="0" y="14" fill="#9ca3af" font-family="monospace" font-size="10">FARE: 25.00 ETB</text>
          <text x="140" y="14" fill="#34d399" font-family="monospace" font-size="10">DEPARTURE: 08:30 AM</text>
        </g>
      </g>

      <!-- Right Panel: Digital Mobile QR Boarding Pass -->
      <g transform="translate(400, 0)">
        <rect x="0" y="0" width="220" height="195" rx="12" fill="#132420" stroke="#10b981" stroke-opacity="0.35"/>
        <text x="18" y="24" fill="#6ee7b7" font-family="monospace" font-size="10" font-weight="bold">DIGITAL QR TICKET</text>
        <text x="18" y="38" fill="#e5e7eb" font-family="sans-serif" font-size="11" font-weight="bold">#ET-84920 · ADDIS ABABA</text>

        <!-- QR Code Graphic Mockup -->
        <g transform="translate(48, 52)">
          <rect x="0" y="0" width="124" height="124" rx="8" fill="#ffffff"/>
          <!-- Position Detection Squares -->
          <rect x="8" y="8" width="32" height="32" fill="#0c1412"/>
          <rect x="14" y="14" width="20" height="20" fill="#ffffff"/>
          <rect x="18" y="18" width="12" height="12" fill="#10b981"/>

          <rect x="84" y="8" width="32" height="32" fill="#0c1412"/>
          <rect x="90" y="14" width="20" height="20" fill="#ffffff"/>
          <rect x="94" y="18" width="12" height="12" fill="#10b981"/>

          <rect x="8" y="84" width="32" height="32" fill="#0c1412"/>
          <rect x="14" y="90" width="20" height="20" fill="#ffffff"/>
          <rect x="18" y="94" width="12" height="12" fill="#10b981"/>

          <!-- Random QR Pixel Matrix -->
          <rect x="48" y="12" width="6" height="6" fill="#0c1412"/>
          <rect x="60" y="16" width="10" height="6" fill="#10b981"/>
          <rect x="48" y="28" width="8" height="8" fill="#0c1412"/>
          <rect x="68" y="28" width="8" height="8" fill="#0c1412"/>
          <rect x="12" y="48" width="8" height="8" fill="#0c1412"/>
          <rect x="28" y="52" width="8" height="6" fill="#10b981"/>
          <rect x="48" y="48" width="28" height="28" fill="#0c1412"/>
          <rect x="54" y="54" width="16" height="16" fill="#ffffff"/>
          <rect x="58" y="58" width="8" height="8" fill="#10b981"/>
          <rect x="84" y="52" width="14" height="6" fill="#0c1412"/>
          <rect x="104" y="48" width="10" height="10" fill="#10b981"/>
          <rect x="48" y="84" width="8" height="16" fill="#0c1412"/>
          <rect x="64" y="88" width="12" height="6" fill="#10b981"/>
          <rect x="84" y="84" width="18" height="12" fill="#0c1412"/>
          <rect x="106" y="92" width="8" height="16" fill="#0c1412"/>
          <rect x="60" y="106" width="18" height="8" fill="#10b981"/>
        </g>
      </g>
    </g>

    <!-- Bottom Tech Stack Tag -->
    <g transform="translate(0, 275)">
      <text x="0" y="16" fill="#a7f3d0" font-family="monospace" font-size="11">FULL-STACK ECOSYSTEM: FastAPI (Python 3.14) · React 18 &amp; TypeScript · Flutter Mobile App (Dart)</text>
      <text x="0" y="34" fill="#6b7280" font-family="monospace" font-size="11">FEATURES: Online Seat &amp; Standing Reservations · Dual Amharic (አማርኛ) i18n · QR Validation · Live Schedules</text>
    </g>
  </g>
</svg>
