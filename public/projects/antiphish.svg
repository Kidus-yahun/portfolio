<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="50%" stop-color="#060608"/>
      <stop offset="100%" stop-color="#120806"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7a5f"/>
      <stop offset="100%" stop-color="#ff3b20"/>
    </linearGradient>
    <radialGradient id="cyberGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ff5c3d" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ff5c3d" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)"/>
  <circle cx="400" cy="220" r="260" fill="url(#cyberGlow)"/>

  <!-- Grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
  </g>

  <!-- Browser / Extension Window Mockup -->
  <rect x="70" y="55" width="660" height="390" rx="16" fill="#0d0d14" stroke="#ff5c3d" stroke-opacity="0.3" stroke-width="1.5"/>
  <rect x="70" y="55" width="660" height="42" rx="16" fill="#13131c"/>
  <rect x="70" y="85" width="660" height="12" fill="#13131c"/>

  <!-- Window Dots -->
  <circle cx="98" cy="76" r="5" fill="#ff5f56"/>
  <circle cx="116" cy="76" r="5" fill="#ffbd2e"/>
  <circle cx="134" cy="76" r="5" fill="#27c93f"/>

  <!-- Extension URL Bar -->
  <rect x="160" y="65" width="360" height="22" rx="6" fill="#08080d" stroke="#ffffff" stroke-opacity="0.1"/>
  <text x="175" y="80" fill="#a0a0b0" font-family="monospace" font-size="11">chrome-extension://anti-phish/threat-shield-v3</text>

  <!-- Status Pill -->
  <rect x="585" y="66" width="125" height="20" rx="10" fill="#22c55e" fill-opacity="0.12" stroke="#22c55e" stroke-opacity="0.4"/>
  <circle cx="598" cy="76" r="3" fill="#22c55e"/>
  <text x="608" y="80" fill="#4ade80" font-family="monospace" font-size="10" font-weight="bold">SHIELD ACTIVE</text>

  <!-- Central Shield Graphic -->
  <g transform="translate(110, 130)">
    <!-- Radar concentric rings -->
    <circle cx="65" cy="80" r="55" fill="none" stroke="#ff5c3d" stroke-opacity="0.15" stroke-dasharray="4 4"/>
    <circle cx="65" cy="80" r="40" fill="none" stroke="#ff5c3d" stroke-opacity="0.25"/>

    <!-- Shield Icon -->
    <path d="M65 35 L105 52 V88 C105 112 87 132 65 140 C43 132 25 112 25 88 V52 Z" 
          fill="url(#shieldGrad)" filter="url(#glow)" opacity="0.95"/>
    <path d="M65 42 L97 56 V88 C97 107 83 124 65 131 C47 124 33 107 33 88 V56 Z" 
          fill="#110503"/>
    <!-- Checkmark / Bolt -->
    <path d="M52 82 L61 91 L79 69" stroke="#ff7a5f" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Threat Neutralized Banner -->
    <g transform="translate(150, 25)">
      <text x="0" y="24" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="900" letter-spacing="-0.5">Anti-Phish Defense Engine</text>
      <text x="0" y="44" fill="#ff7a5f" font-family="monospace" font-size="12" font-weight="bold">MANIFEST V3 · REAL-TIME NLP HEURISTICS</text>
      
      <!-- Alert Box -->
      <rect x="0" y="60" width="410" height="70" rx="8" fill="#180a08" stroke="#ff5c3d" stroke-opacity="0.4"/>
      <circle cx="20" cy="85" r="4" fill="#ff5c3d"/>
      <text x="32" y="80" fill="#fca5a5" font-family="monospace" font-size="11" font-weight="bold">Intercepted Typosquatting Attack</text>
      <text x="32" y="98" fill="#9ca3af" font-family="monospace" font-size="10">Target: paypaI-login.xyz (Homoglyph spoof 0x6C ➔ 0x49)</text>
      <text x="32" y="116" fill="#4ade80" font-family="monospace" font-size="10">Status: Neutralized · Forensic vector logged to memory</text>
    </g>
  </g>

  <!-- Bottom Metric Tags -->
  <g transform="translate(100, 375)">
    <rect x="0" y="0" width="160" height="34" rx="8" fill="#141420" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="14" y="15" fill="#9ca3af" font-family="monospace" font-size="9">DETECTION ACCURACY</text>
    <text x="14" y="28" fill="#ffffff" font-family="monospace" font-size="12" font-weight="bold">99.4% (Zero-Day)</text>

    <rect x="180" y="0" width="160" height="34" rx="8" fill="#141420" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="194" y="15" fill="#9ca3af" font-family="monospace" font-size="9">INSPECTION LATENCY</text>
    <text x="194" y="28" fill="#ff7a5f" font-family="monospace" font-size="12" font-weight="bold">&lt; 38ms (Non-blocking)</text>

    <rect x="360" y="0" width="240" height="34" rx="8" fill="#141420" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="374" y="15" fill="#9ca3af" font-family="monospace" font-size="9">CORE STACK</text>
    <text x="374" y="28" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold">TypeScript · NLP · MV3 · Python</text>
  </g>
</svg>
