<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="anBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080f14"/>
      <stop offset="50%" stop-color="#05090d"/>
      <stop offset="100%" stop-color="#0b171c"/>
    </linearGradient>
    <radialGradient id="cyanGlow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="500" fill="url(#anBg)"/>
  <circle cx="400" cy="200" r="260" fill="url(#cyanGlow)"/>

  <!-- Window Mockup -->
  <rect x="70" y="55" width="660" height="390" rx="16" fill="#091217" stroke="#06b6d4" stroke-opacity="0.3" stroke-width="1.5"/>
  <rect x="70" y="55" width="660" height="42" rx="16" fill="#0f1c24"/>
  <rect x="70" y="85" width="660" height="12" fill="#0f1c24"/>

  <!-- Window Dots -->
  <circle cx="98" cy="76" r="5" fill="#ff5f56"/>
  <circle cx="116" cy="76" r="5" fill="#ffbd2e"/>
  <circle cx="134" cy="76" r="5" fill="#27c93f"/>

  <!-- URL Bar -->
  <rect x="160" y="65" width="340" height="22" rx="6" fill="#070e12" stroke="#ffffff" stroke-opacity="0.1"/>
  <text x="175" y="80" fill="#a5f3fc" font-family="monospace" font-size="11">anser://ai-reasoning/sub-400ms-consensus-pipeline</text>

