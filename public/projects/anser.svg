  <text x="588" y="80" fill="#67e8f9" font-family="monospace" font-size="10" font-weight="bold">AI EXTENSION</text>

  <!-- Main Content Stage -->
  <g transform="translate(100, 120)">
    <text x="0" y="24" fill="#ffffff" font-family="sans-serif" font-size="22" font-weight="900">Anser AI Multimodal Solver</text>
    <text x="0" y="44" fill="#22d3ee" font-family="monospace" font-size="12" font-weight="bold">SUB-400MS MULTIMODAL REASONING &amp; PARALLEL TOKEN PIPELINE</text>

    <!-- Telemetry Cards -->
    <g transform="translate(0, 65)">
      <rect x="0" y="0" width="190" height="80" rx="10" fill="#0c181f" stroke="#06b6d4" stroke-opacity="0.3"/>
      <text x="16" y="26" fill="#9ca3af" font-family="monospace" font-size="10">WATCHDOG LATENCY CAP</text>
      <text x="16" y="55" fill="#38bdf8" font-family="sans-serif" font-size="24" font-weight="bold">284 ms</text>
      <text x="16" y="70" fill="#34d399" font-family="monospace" font-size="9">Sub-400ms target maintained</text>

      <rect x="205" y="0" width="190" height="80" rx="10" fill="#0c181f" stroke="#06b6d4" stroke-opacity="0.3"/>
      <text x="221" y="26" fill="#9ca3af" font-family="monospace" font-size="10">PARALLEL CONSENSUS</text>
      <text x="221" y="55" fill="#ffffff" font-family="sans-serif" font-size="24" font-weight="bold">Active</text>
      <text x="221" y="70" fill="#9ca3af" font-family="monospace" font-size="9">Non-blocking token extractors</text>

      <rect x="410" y="0" width="190" height="80" rx="10" fill="#0c181f" stroke="#06b6d4" stroke-opacity="0.3"/>
      <text x="426" y="26" fill="#9ca3af" font-family="monospace" font-size="10">TOKEN EXTRACTION</text>
      <text x="426" y="55" fill="#ff7a5f" font-family="sans-serif" font-size="20" font-weight="bold">Vision + Text</text>
      <text x="426" y="70" fill="#9ca3af" font-family="monospace" font-size="9">DOM &amp; Image canvas parser</text>
    </g>

    <!-- Neural Stream Console Line -->
    <g transform="translate(0, 165)">
      <rect x="0" y="0" width="600" height="75" rx="10" fill="#09141a" stroke="#ffffff" stroke-opacity="0.08"/>
      <text x="16" y="24" fill="#a5f3fc" font-family="monospace" font-size="11">stream://token_eval: [consensus_ratio: 0.96] [frame_bounds: 1920x1080]</text>
      <text x="16" y="44" fill="#67e8f9" font-family="monospace" font-size="11">&gt; Fast-path response rendered in 312ms · Zero freeze</text>
      <text x="16" y="62" fill="#6b7280" font-family="monospace" font-size="10">STACK: TypeScript · Multimodal LLM Heuristics · Web Workers · Manifest V3</text>
    </g>
